name: daily

on:
  schedule:
    - cron: "0 21 * * *"  # 毎朝6時（日本時間）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 価格を取得
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: python fetch.py
      - name: サイトを作る
        run: python build.py
      - name: 保存
        run: |
          git config user.name "raka-works"
          git config user.email "raka-works@users.noreply.github.com"
          git add data/history.json index.html
          git diff --cached --quiet || git commit -m "update $(date +%F)"
          git push
